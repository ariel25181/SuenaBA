<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Vinyl Groove circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#1e293b" stroke-width="3" />

  <!-- Central Glow -->
  <circle cx="256" cy="256" r="80" fill="#f59e0b" opacity="0.15" filter="url(#glow)" />

  <!-- Stylized Music Note / Soundwave Emblem in Gold -->
  <g transform="translate(146, 126)" fill="url(#goldGrad)">
    <path d="M190 20 L70 54 C60 57 54 66 54 76 L54 186 C44 178 30 174 14 179 C-10 186 -22 212 -12 236 C-2 258 24 270 48 263 C68 257 82 238 82 218 L82 120 L190 90 L190 156 C180 148 166 144 150 149 C126 156 114 182 124 206 C134 228 160 240 184 233 C204 227 218 208 218 188 L218 42 C218 29 206 18 190 20 Z" />
  </g>

  <!-- Buenos Aires Night Star Indicator -->
  <polygon points="390,110 396,128 414,134 396,140 390,158 384,140 366,134 384,128" fill="#fbbf24" opacity="0.9" />
</svg>
